version: "3.8"

services:

  fresh-arsiv:

    image: ghcr.io/ftihdgn-code/freshdesk-backup-viewer:latest

    networks:

      - traefik-public

    environment:
      - MONGO_URI=mongodb://192.168.208.169:27017/freshdesk
      - PORT=3001
      - MEDIA_ORIGIN=http://192.168.208.169:3001
      - AZURE_STORAGE_ACCOUNT=apsiyon
      - AZURE_STORAGE_CONTAINER=verimor-archive
      - AZURE_TENANT_ID=ee5e8a95-7505-442b-bc1a-a7a55da37167
      - AZURE_CLIENT_ID=8e1a1f98-29c0-4c5b-ab88-79fe47dac7ed

    # AZURE_CLIENT_SECRET artık env var değil, Swarm secret olarak mount ediliyor.
    # Gerçek Swarm secret adı azure_client_secret_v2 (eski azure_client_secret zaten
    # başka bir service'te kullanımdaydı, silinemediği için versiyonlandı) — ama
    # container içinde kodun beklediği eski isimle (/run/secrets/azure_client_secret)
    # mount ediliyor, kod tarafında değişiklik gerekmiyor.
    secrets:
      - source: azure_client_secret_v2
        target: azure_client_secret

    deploy:

      replicas: 1

      labels:

        - "traefik.enable=true"

        # Router (HTTPS)
        - "traefik.http.routers.fresharsiv.rule=Host(`fresharshive.apsiyon.com`)"
        - "traefik.http.routers.fresharsiv.entrypoints=websecure"
        - "traefik.http.routers.fresharsiv.tls=true"

        # Service
        - "traefik.http.services.fresharsiv.loadbalancer.server.port=3001"

networks:
  traefik-public:
    external: true

secrets:
  azure_client_secret_v2:
    external: true
