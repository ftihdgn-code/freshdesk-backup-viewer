<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Freshdesk Ticket Arşivi</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    background: #f8fafc;
    color: #1e293b;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: #fef3c7; border: 1px solid #fde68a; color: #b45309;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-icon svg { width: 17px; height: 17px; }
  .brand-title { display: flex; align-items: baseline; gap: 7px; }
  .brand-title h1 { font-size: 15px; font-weight: 700; margin: 0; color: #0f172a; }
  .brand-chip {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 5px; padding: 1px 6px;
  }
  .brand-sub { font-size: 10.5px; color: #94a3b8; margin: 1px 0 0; }

  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 640px; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: #94a3b8; pointer-events: none; }
  header input#q {
    width: 100%;
    padding: 8px 40px 8px 34px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 13px;
    color: #1e293b;
  }
  header input#q:focus { outline: none; background: #fff; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.12); }
  .kbd-hint {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 9.5px; font-family: ui-monospace, monospace; color: #94a3b8;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 5px;
    pointer-events: none;
  }

  .btn {
    padding: 8px 14px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #475569;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #f1f5f9; }

  .columns-wrap { position: relative; }
  #columnsPanel {
    display: none;
    position: absolute;
    top: 115%;
    right: 0;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(15,23,42,0.12);
    padding: 10px;
    width: 220px;
    max-height: 340px;
    overflow-y: auto;
    z-index: 30;
  }
  #columnsPanel.visible { display: block; }
  #columnsPanel label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 6px; cursor: pointer; border-radius: 6px; color: #334155; }
  #columnsPanel label:hover { background: #f1f5f9; }

  .container { max-width: 1400px; margin: 20px auto; padding: 0 24px; }
  .meta-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-bottom: 12px;
  }
  .meta-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .total-chip {
    font-size: 11.5px; font-weight: 600; color: #475569;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 4px 12px;
  }
  .clear-filters { font-size: 11.5px; color: #0369a1; cursor: pointer; font-weight: 500; }
  .clear-filters:hover { text-decoration: underline; }
  .perpage-select {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #64748b;
  }
  .perpage-select select {
    font-size: 11.5px; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #334155;
  }

  .table-wrap { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,0.04); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; font-size: 12.5px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
  th { background: #f8fafc; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.3px; border-bottom: 1px solid #e2e8f0; }
  td.col-subject, th.col-subject { white-space: normal; min-width: 280px; }
  tr.ticket-row { cursor: pointer; transition: background 0.1s; }
  tr.ticket-row:hover { background: #f8fafc; }
  tr.ticket-row:hover .subject-text { text-decoration: underline; }
  td.col-id { font-family: ui-monospace, monospace; font-weight: 700; color: #0f172a; }
  tr.ticket-row:hover td.col-id { color: #0369a1; }

  .row-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
  .dot-closed { background: #10b981; }
  .dot-open { background: #f59e0b; }
  .subject-cell { display: flex; align-items: center; }
  .subject-text { font-weight: 600; color: #0f172a; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .badge-closed { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .badge-closed .badge-dot { background: #10b981; }
  .badge-open { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .badge-open .badge-dot { background: #f59e0b; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-plain { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 2px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }

  .review-btn {
    padding: 4px 12px; font-size: 11px; font-weight: 700; color: #0369a1;
    background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 7px; cursor: pointer;
  }
  .review-btn:hover { background: #e0f2fe; }

  .pager-bar {
    display: flex; align-items: center; justify-content: center; gap: 4px; margin: 18px 0;
  }
  .pager-bar button {
    padding: 6px 12px; border: 1px solid #e2e8f0; background: #fff; color: #334155;
    border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 500;
  }
  .pager-bar button:hover:not(:disabled) { background: #f8fafc; }
  .pager-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager-bar .page-info { padding: 6px 12px; font-size: 12px; font-weight: 600; color: #1e293b; background: #f1f5f9; border-radius: 7px; }
  .empty { text-align: center; padding: 60px; color: #94a3b8; font-size: 13px; }

  tr.filter-row th { padding: 6px 10px; background: #fff; border-bottom: 1px solid #e2e8f0; }
  tr.filter-row input, tr.filter-row select {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 400;
    text-transform: none;
    background: #f8fafc;
    color: #1e293b;
  }
  tr.filter-row input:focus, tr.filter-row select:focus { outline: none; background: #fff; border-color: #0284c7; }

  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #overlay.visible { display: flex; }
  #panel {
    position: relative;
    background: #fff;
    width: 1000px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 14px;
    padding: 28px 32px;
    box-shadow: 0 20px 60px rgba(15,23,42,0.25);
  }
  #panel .close { position: absolute; top: 18px; right: 20px; cursor: pointer; font-size: 20px; color: #94a3b8; z-index: 1; }
  #panel .close:hover { color: #475569; }

  /* Ticket detail header (mirrors the Zendesk app's modal.html) */
  .th-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding-right: 24px; }
  .th-header-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .th-icon {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: #fef3c7; border: 1px solid #fde68a; color: #b45309;
    display: flex; align-items: center; justify-content: center;
  }
  .th-icon svg { width: 18px; height: 18px; }
  .th-header h1 { font-size: 16px; font-weight: 700; color: #0f172a; line-height: 1.35; margin: 0 0 6px; }
  .th-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .th-actions { flex-shrink: 0; }
  .transcript-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc;
    color: #475569; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .transcript-btn:hover { background: #f1f5f9; }
  .transcript-btn svg { width: 12px; height: 12px; }
  .created-by { display: flex; align-items: center; gap: 6px; color: #64748b; font-size: 11.5px; margin-top: 6px; }

  .th-badges .badge, .th-badges .badge-plain { font-size: 10.5px; }
  .badge-id { color: #94a3b8; font-weight: 500; background: transparent !important; border: none !important; padding: 0 !important; }
  .badge svg { width: 10px; height: 10px; }
  .badge-channel-1 { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .badge-channel-2 { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .badge-channel-3 { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-channel-4 { background: #faf5ff; color: #7e22ce; border: 1px solid #e9d5ff; }
  .badge-channel-5 { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .badge-channel-7 { background: #f0f9ff; color: #0284c7; border: 1px solid #bae6fd; }
  .badge-channel-8 { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .badge-channel-9 { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }

  /* Ana Bilgiler / Özel Alanlar cards */
  .meta-grid-popup { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 18px; }
  @media (min-width: 640px) { .meta-grid-popup { grid-template-columns: 3fr 2fr; } }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    color: #64748b; padding-bottom: 9px; margin-bottom: 11px; border-bottom: 1px solid #f1f5f9;
  }
  .card-head-icon { display: flex; align-items: center; gap: 5px; }
  .card-head-icon svg { width: 13px; height: 13px; color: #94a3b8; flex-shrink: 0; }
  .card-head-sub { font-size: 10px; font-weight: 500; color: #94a3b8; text-transform: none; letter-spacing: normal; }
  .card-head .count-chip {
    font-size: 10px; font-weight: 600; color: #0369a1; background: #f0f9ff;
    padding: 1px 6px; border-radius: 5px; text-transform: none; letter-spacing: normal;
  }

  .field-list { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
  @media (min-width: 460px) { .field-list { grid-template-columns: repeat(3, 1fr); } }
  .field-item { min-width: 0; }
  .field-label { display: block; font-size: 10px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .field-value { font-size: 12.5px; color: #1e293b; font-weight: 500; word-break: break-word; }
  .field-value.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; color: #475569; }
  .field-with-avatar { display: flex; align-items: center; gap: 6px; }
  .field-chip { display: inline-flex; font-size: 11.5px; font-weight: 600; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 5px; padding: 2px 8px; }

  .tags-row { grid-column: 1 / -1; padding-top: 9px; margin-top: 2px; border-top: 1px solid #f1f5f9; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip { font-size: 10.5px; font-weight: 500; color: #475569; background: #f1f5f9; border-radius: 5px; padding: 2px 7px; }

  .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cf-item { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 7px; padding: 6px 8px; min-width: 0; }
  .cf-key { display: block; font-size: 9.5px; font-weight: 600; color: #94a3b8; font-family: ui-monospace, monospace; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-val { font-size: 11.5px; font-weight: 600; color: #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-empty { font-size: 11.5px; color: #94a3b8; padding: 4px 0; }

  .section-title { font-size: 12px; font-weight: 700; margin: 20px 0 9px; color: #334155; text-transform: uppercase; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
  .section-title .dot { width: 7px; height: 7px; border-radius: 50%; background: #0369a1; display: inline-block; }
  .section-title .count { font-weight: 500; color: #94a3b8; text-transform: none; letter-spacing: normal; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 9px; }
  .section-title-row .section-title { margin: 0; }
  .expand-all-btn { font-size: 11px; font-weight: 600; color: #0369a1; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 7px; padding: 4px 11px; cursor: pointer; }
  .expand-all-btn:hover { background: #e0f2fe; }

  .conv-body-full { border: 1px solid #e2e8f0; border-radius: 10px; padding: 13px 15px; font-size: 13px; line-height: 1.6; overflow-x: auto; background: #fff; }

  .conv-item { border-radius: 10px; padding: 11px 15px; margin-bottom: 8px; font-size: 13px; line-height: 1.6; overflow-x: auto; background: #fff; border: 1px solid #e2e8f0; }
  .conv-item.conv-private { background: #fffbeb; border-color: #fde68a; }
  .conv-item.conv-has-rec { border-color: #f59e0b; border-width: 1.5px; box-shadow: 0 1px 3px rgba(245,158,11,0.12); }
  .conv-meta-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .conv-item.open .conv-meta-row { margin-bottom: 7px; }
  .conv-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 6px; border-radius: 5px; }
  .conv-tag-customer { background: #eff6ff; color: #1d4ed8; }
  .conv-tag-agent { background: #f1f5f9; color: #475569; }
  .conv-tag-private { background: #fef3c7; color: #92400e; }
  .conv-time { font-size: 11px; color: #94a3b8; }
  .conv-chevron-icon { width: 12px; height: 12px; color: #94a3b8; transition: transform 0.15s; margin-left: auto; flex-shrink: 0; }
  .conv-item.open .conv-chevron-icon { transform: rotate(90deg); }
  .conv-body, .conv-rec-slot { display: none; }
  .conv-item.open .conv-body, .conv-item.open .conv-rec-slot { display: block; }

  .rec-player { margin-top: 8px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 10px; padding: 10px 12px; color: #fff; }
  .rec-player-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .rec-player-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #cbd5e1; min-width: 0; }
  .rec-player-label .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; flex-shrink: 0; }
  .rec-player-label .blob-name { font-family: ui-monospace, monospace; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec-ambiguous { font-size: 10.5px; color: #fbbf24; margin-bottom: 6px; }
  audio.rec-audio { width: 100%; height: 32px; }

  .att-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .att-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; }
  .att-item a { color: #0369a1; font-size: 12px; font-weight: 600; text-decoration: none; }
  .att-item a:hover { text-decoration: underline; }
  .att-size { color: #94a3b8; font-size: 11px; white-space: nowrap; }
  .empty-note { color: #94a3b8; font-size: 12.5px; padding: 6px 0; }

  .chat-thread { display: flex; flex-direction: column; gap: 14px; }
  .chat-row { display: flex; align-items: flex-end; gap: 8px; max-width: 74%; }
  .chat-row.row-customer { margin-right: auto; }
  .chat-row.row-agent { margin-left: auto; flex-direction: row-reverse; }
  .chat-col { display: flex; flex-direction: column; min-width: 0; }
  .row-agent .chat-col { align-items: flex-end; }
  .chat-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .row-agent .chat-head { flex-direction: row-reverse; }
  .chat-name { font-size: 11px; font-weight: 700; color: #475569; }
  .chat-role-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; padding: 1px 6px; border-radius: 5px; }
  .chat-role-tag.tag-customer { background: #eff6ff; color: #1d4ed8; }
  .chat-role-tag.tag-agent { background: #f0f9ff; color: #0369a1; }
  .chat-bubble { padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .row-customer .chat-bubble { background: #fff; border: 1px solid #e2e8f0; color: #1e293b; border-bottom-left-radius: 3px; }
  .row-agent .chat-bubble { background: #0369a1; color: #fff; border-bottom-right-radius: 3px; }
  .chat-ts { font-size: 10px; color: #adb5bd; margin-top: 3px; }
  .row-agent .chat-ts { text-align: right; }

  .chat-system {
    display: flex; align-items: flex-start; gap: 9px; max-width: 88%; margin: 2px auto;
    background: #eff6ff; border: 1px solid #dbeafe; border-radius: 13px; padding: 10px 13px;
  }
  .chat-system-icon {
    width: 22px; height: 22px; border-radius: 6px; background: #3b82f6; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-system-icon svg { width: 12px; height: 12px; }
  .chat-system-body { min-width: 0; }
  .chat-system-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
  .chat-system-name { font-size: 11px; font-weight: 700; color: #1e3a8a; }
  .chat-system-text { font-size: 12.5px; line-height: 1.5; color: #1e3a8a; }

  .chat-date-divider { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .chat-date-divider::before, .chat-date-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
  .chat-date-divider span { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 13px 15px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .stat-label { font-size: 10.5px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-value { font-size: 21px; font-weight: 700; color: #0f172a; margin-top: 3px; line-height: 1.2; }
  .stat-sub { font-size: 10.5px; font-weight: 600; margin-left: 7px; }
  .stat-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-icon svg { width: 17px; height: 17px; }
  .stat-icon-blue { background: #eff6ff; color: #2563eb; }
  .stat-icon-emerald { background: #ecfdf5; color: #059669; }
  .stat-icon-purple { background: #faf5ff; color: #9333ea; }
  .stat-skel { color: #cbd5e1; }

  @media (max-width: 900px) {
    .container { margin: 12px auto; padding: 0 10px; }
    header { padding: 10px 12px; }
    .search-wrap { min-width: 120px; }
    #panel { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">

<script>
const STATUS_OPTIONS = [
  ['2', 'Açık'], ['3', 'Beklemede'], ['4', 'Çözüldü'], ['5', 'Kapandı'],
  ['6', 'Müşteri Yanıtı Bekleniyor'], ['7', '3. Taraf Yanıtı Bekleniyor'],
];
const PRIORITY_OPTIONS = [['1', 'Düşük'], ['2', 'Orta'], ['3', 'Yüksek'], ['4', 'Acil']];
const SOURCE_OPTIONS = [
  ['1', 'E-posta'], ['2', 'Portal'], ['3', 'Telefon'], ['4', 'Chat'],
  ['5', 'Feedback'], ['7', 'Twitter'], ['8', 'Facebook'], ['9', 'Bot'],
];

function isClosedStatus(status) { return status === 4 || status === 5; }

function statusBadge(status, label) {
  const cls = isClosedStatus(status) ? 'badge-closed' : 'badge-open';
  return `<span class="badge ${cls}"><span class="badge-dot"></span>${label || '-'}</span>`;
}

// field: backend'e gönderilecek query param adı (metin alanlar için doğrudan, date için _from/_to eklenir)
const ALL_COLUMNS = [
  { key: '_id', label: '#', field: 'id', type: 'number', default: true, render: t => `<span class="col-id">${t._id}</span>` },
  {
    key: 'subject', label: 'Konu', field: 'subject', type: 'text', default: true,
    render: t => `<span class="subject-cell"><span class="row-dot ${isClosedStatus(t.status) ? 'dot-closed' : 'dot-open'}"></span><span class="subject-text">${t.subject || '(konu yok)'}</span></span>`,
  },
  { key: 'requester_name', label: 'Müşteri', field: 'requester_name', type: 'text', default: true, render: t => t.requester_name || '-' },
  { key: 'requester_email', label: 'E-posta', field: 'requester_email', type: 'text', default: false, render: t => t.requester_email || '-' },
  { key: 'company_name', label: 'Şirket', field: 'company_name', type: 'text', default: true, render: t => t.company_name || '-' },
  { key: 'status_label', label: 'Durum', field: 'status', type: 'select', options: STATUS_OPTIONS, default: true, render: t => statusBadge(t.status, t.status_label) },
  { key: 'priority_label', label: 'Öncelik', field: 'priority', type: 'select', options: PRIORITY_OPTIONS, default: false, render: t => t.priority_label ? `<span class="badge-plain">${t.priority_label}</span>` : '-' },
  { key: 'source_label', label: 'Kaynak', field: 'source', type: 'select', options: SOURCE_OPTIONS, default: false, render: t => t.source_label ? `<span class="badge-plain">${t.source_label}</span>` : '-' },
  { key: 'agent_name', label: 'Ajan', field: 'agent_name', type: 'text', default: true, render: t => t.agent_name || '-' },
  { key: 'group_name', label: 'Grup', field: 'group_name', type: 'text', default: false, render: t => t.group_name || '-' },
  { key: 'ticket_type', label: 'Tür', field: 'ticket_type', type: 'text', default: false, render: t => t.ticket_type || '-' },
  { key: 'tags', label: 'Etiketler', field: 'tags', type: 'text', default: false, render: t => (t.tags || []).join(', ') || '-' },
  { key: 'created_at', label: 'Oluşturulma', field: 'created_at', type: 'date', default: true, render: t => fmtDate(t.created_at) },
  { key: 'updated_at', label: 'Güncellenme', field: 'updated_at', type: 'date', default: false, render: t => fmtDate(t.updated_at) },
  { key: 'due_by', label: 'Termin', field: 'due_by', type: 'date', default: false, render: t => fmtDate(t.due_by) },
];

const STORAGE_KEY = 'fd_arsiv_columns_v1';
const PERPAGE_KEY = 'fd_arsiv_perpage_v1';
let visibleKeys = loadColumnPrefs();
let page = 1;
let perPage = loadPerPagePref();

function loadColumnPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length) return saved;
  } catch (_) {}
  return ALL_COLUMNS.filter(c => c.default).map(c => c.key);
}

function saveColumnPrefs() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(visibleKeys));
}

function loadPerPagePref() {
  const saved = Number(localStorage.getItem(PERPAGE_KEY));
  return [15, 25, 50, 100].includes(saved) ? saved : 25;
}

function visibleColumns() {
  return ALL_COLUMNS.filter(c => visibleKeys.includes(c.key));
}

function fmtDate(d) {
  if (!d) return '-';
  return new Date(d).toLocaleString('tr-TR');
}

const AVATAR_COLORS = ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

function initialsAvatar(name, size) {
  if (!name) return '';
  const parts = name.trim().split(/\s+/).filter(Boolean);
  const initials = ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  const px = size || 22;
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${px}px;height:${px}px;border-radius:50%;background:${color};color:#fff;font-size:${Math.round(px*0.42)}px;font-weight:600;flex-shrink:0;vertical-align:middle;">${initials}</span>`;
}

function sanitizeHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('script, style, iframe, object, embed, link, meta').forEach(el => el.remove());
  div.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) el.removeAttribute(attr.name);
      if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
    });
    if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
  });
  return div.innerHTML;
}

// Sadece bilinen gerçek HTML etiketlerini arar — "<akademi@apsiyon.com>" gibi
// köşeli parantezli e-posta adresleri "<a...>" etiketiyle karışıp yanlışlıkla
// HTML sanılmasın diye \b (kelime sınırı) kullanılıyor.
function looksLikeHtml(s) {
  return /<\/?(?:div|p|span|br|hr|strong|b|i|em|u|a|ul|ol|li|table|thead|tbody|tr|td|th|blockquote|h[1-6]|img|pre|code)\b/i.test(s || '');
}

// Bazı ticket'larda (özellikle chat widget kaynaklı) description/conversation
// düz metin olarak geliyor: "İsim   mesaj   HH:MM AM, Dth Mon   İsim   mesaj ...".
// Zaman damgası kalıbına göre bölüp müşteri/ekip ayrımıyla chat baloncuğu gibi göster.
function renderChatText(text, requesterName) {
  if (!text) return '';
  const TS_RE = /(\d{1,2}:\d{2}\s*[AP]M,\s*\d{1,2}(?:st|nd|rd|th)?\s*\w+)/g;
  const parts = text.split(TS_RE).map(s => s.trim()).filter(Boolean);
  const turns = [];
  for (let i = 0; i < parts.length; i += 2) {
    const chunk = parts[i];
    const ts = parts[i + 1] || '';
    if (!ts) { turns.push(null); continue; }
    const tokens = chunk.split(/\s{2,}|\n+/).map(s => s.trim()).filter(Boolean);
    const name = tokens.shift() || '';
    const msg = tokens.join(' ');
    if (msg) turns.push({ name, msg, ts });
  }

  if (!turns.filter(Boolean).length) {
    return text.split(/\s{2,}|\n+/).map(s => s.trim()).filter(Boolean)
      .map(line => `<div>${escText(line)}</div>`).join('');
  }

  // İlk konuşan (sistem/bot mesajı değil) taraf müşteridir (chat'ler genelde bot
  // karşılamasıyla başlar) — ticket'taki requester_name ile chat'teki görünen ad her
  // zaman örtüşmeyebiliyor, bu yüzden requester_name'e güvenmek yerine transkriptin
  // kendisinden çıkarıyoruz.
  const liveTurns = turns.filter(Boolean);
  const firstHumanTurn = liveTurns.find(t => !isSystemSender(t.name)) || liveTurns[0];
  const customerName = firstHumanTurn.name.toLowerCase();
  let lastDate = null;
  return '<div class="chat-thread">' + liveTurns.map(t => {
    // ts örneği: "09:13 AM, 29th Jul" — virgülden sonrası tarih kısmı, gün değişince ayraç göster.
    const dateOnly = t.ts.split(',')[1]?.trim() || '';
    const dateDivider = dateOnly && dateOnly !== lastDate ? `<div class="chat-date-divider"><span>${escText(dateOnly)}</span></div>` : '';
    lastDate = dateOnly || lastDate;

    if (isSystemSender(t.name)) {
      return dateDivider + `
        <div class="chat-system">
          <div class="chat-system-icon">${SYSTEM_MSG_ICON_SVG}</div>
          <div class="chat-system-body">
            <div class="chat-system-head">
              <span class="chat-system-name">${escText(t.name)}</span>
              <span class="chat-ts">${escText(t.ts)}</span>
            </div>
            <div class="chat-system-text">${escText(t.msg)}</div>
          </div>
        </div>`;
    }

    const isCustomer = t.name.toLowerCase() === customerName;
    const rowCls = isCustomer ? 'row-customer' : 'row-agent';
    const tagCls = isCustomer ? 'tag-customer' : 'tag-agent';
    const tagLabel = isCustomer ? 'Müşteri' : 'Temsilci';
    return dateDivider + `
      <div class="chat-row ${rowCls}">
        ${initialsAvatar(t.name, 24)}
        <div class="chat-col">
          <div class="chat-head">
            <span class="chat-name">${escText(t.name)}</span>
            <span class="chat-role-tag ${tagCls}">${tagLabel}</span>
          </div>
          <div class="chat-bubble">${escText(t.msg)}</div>
          <div class="chat-ts">${escText(t.ts)}</div>
        </div>
      </div>`;
  }).join('') + '</div>';
}

// Chat widget'larının otomatik/bot mesajları genelde ürün adıyla ("Apsiyon", "Sistem",
// "Bot" vb.) geliyor — bunları müşteri/temsilci baloncuğu yerine ayrı, nötr bir
// "sistem mesajı" kartı olarak göstermek orijinal Freshdesk görünümüne daha yakın.
const SYSTEM_SENDER_RE = /^(apsiyon|sistem|system|bot|chat\s*bot|otomatik)\b/i;
function isSystemSender(name) {
  return SYSTEM_SENDER_RE.test((name || '').trim());
}

const SYSTEM_MSG_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

function escText(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Sütun seçici panel ──────────────────────────────
function renderColumnsPanel() {
  const panel = document.getElementById('columnsPanel');
  panel.innerHTML = ALL_COLUMNS.map(c => `
    <label>
      <input type="checkbox" data-key="${c.key}" ${visibleKeys.includes(c.key) ? 'checked' : ''} />
      ${c.label}
    </label>
  `).join('');
  panel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.dataset.key;
      if (cb.checked) {
        if (!visibleKeys.includes(key)) visibleKeys.push(key);
      } else {
        visibleKeys = visibleKeys.filter(k => k !== key);
      }
      saveColumnPrefs();
      renderTableStructure();
      page = 1;
      load();
    });
  });
}

document.getElementById('columnsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('columnsPanel').classList.toggle('visible');
});
document.addEventListener('click', () => document.getElementById('columnsPanel').classList.remove('visible'));
document.getElementById('columnsPanel').addEventListener('click', (e) => e.stopPropagation());

// ── Tablo başlık + filtre satırını sütun seçimine göre oluştur ──
function renderTableStructure() {
  const cols = visibleColumns();
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = cols.map(c => `<th class="${c.key === 'subject' ? 'col-subject' : ''}">${c.label}</th>`).join('') + '<th style="text-align:right;">İşlem</th>';

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = cols.map(c => {
    if (c.type === 'select') {
      return `<th><select data-field="${c.field}" data-type="${c.type}">
        <option value="">Tümü</option>
        ${c.options.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}
      </select></th>`;
    }
    if (c.type === 'date') {
      return `<th style="display:flex;gap:4px;">
        <input type="date" data-field="${c.field}" data-type="date-from" title="Başlangıç" />
        <input type="date" data-field="${c.field}" data-type="date-to" title="Bitiş" />
      </th>`;
    }
    if (c.type === 'number') {
      return `<th><input type="text" inputmode="numeric" data-field="${c.field}" data-type="number" placeholder="Ara..." /></th>`;
    }
    return `<th><input type="text" data-field="${c.field}" data-type="text" placeholder="Ara..." /></th>`;
  }).join('') + '<th></th>';

  filterRow.querySelectorAll('input, select').forEach(el => {
    const evt = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(evt, () => {
      clearTimeout(window._filterDebounce);
      window._filterDebounce = setTimeout(() => { page = 1; load(); }, 300);
    });
  });
}

function collectColumnFilterParams() {
  const params = {};
  document.querySelectorAll('#filterRow [data-field]').forEach(el => {
    if (!el.value) return;
    if (el.dataset.type === 'date-from') params[el.dataset.field + '_from'] = el.value;
    else if (el.dataset.type === 'date-to') params[el.dataset.field + '_to'] = el.value;
    else params[el.dataset.field] = el.value;
  });
  return params;
}

function clearFilters() {
  document.getElementById('q').value = '';
  document.querySelectorAll('#filterRow [data-field]').forEach(el => { el.value = ''; });
  page = 1;
  load();
}

async function load() {
  const q = document.getElementById('q').value;
  const params = new URLSearchParams({ page, per_page: perPage });
  if (q) params.set('q', q);
  for (const [k, v] of Object.entries(collectColumnFilterParams())) params.set(k, v);

  const res = await fetch('/api/tickets?' + params.toString());
  const data = await res.json();

  const cols = visibleColumns();
  const rows = document.getElementById('rows');
  if (!data.results || data.results.length === 0) {
    rows.innerHTML = `<tr><td colspan="${cols.length + 1}" class="empty">Sonuç bulunamadı.</td></tr>`;
  } else {
    rows.innerHTML = data.results.map(t => `
      <tr class="ticket-row" data-id="${t._id}">
        ${cols.map(c => `<td class="${c.key === '_id' ? 'col-id' : ''} ${c.key === 'subject' ? 'col-subject' : ''}">${c.render(t)}</td>`).join('')}
        <td style="text-align:right;"><button class="review-btn" data-id="${t._id}">İncele</button></td>
      </tr>
    `).join('');
  }

  document.getElementById('meta').textContent = `Toplam ${data.total.toLocaleString('tr-TR')} ticket`;
  const totalPages = Math.max(1, Math.ceil(data.total / perPage));
  document.getElementById('pageInfo').textContent = `Sayfa ${data.page} / ${totalPages}`;
  document.getElementById('first').disabled = page <= 1;
  document.getElementById('prev').disabled = page <= 1;
  document.getElementById('next').disabled = page >= totalPages;
  document.getElementById('last').disabled = page >= totalPages;

  document.querySelectorAll('.ticket-row').forEach(row => {
    row.addEventListener('click', () => openTicket(row.dataset.id));
  });
  document.querySelectorAll('.review-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openTicket(btn.dataset.id); });
  });

  window._lastTotalPages = totalPages;
}

const TICKET_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>`;
const INFO_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
const TAG_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>`;
const DOWNLOAD_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;

// Kaynak (source) numaraları Freshdesk'in sabit enum'u: 1 E-posta, 2 Portal, 3 Telefon,
// 4 Chat, 5 Feedback, 7 Twitter, 8 Facebook, 9 Bot — her biri için ayrı ikon/renk.
const CHANNEL_ICONS = {

function channelBadgeHtml(source, label) {
  const icon = CHANNEL_ICONS[source] || '';
  return `<span class="badge badge-channel-${source || 0}">${icon}${label}</span>`;
}

function stripToText(raw) {
  if (!raw) return '';
  if (!looksLikeHtml(raw)) return raw;
  const div = document.createElement('div');
  div.innerHTML = raw;
  return div.textContent || '';
}

async function openTicket(id) {
  const res = await fetch('/api/ticket?id=' + id);
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  const t = data.ticket;
  const isClosed = isClosedStatus(t.status);
  const customFields = Object.entries(t.custom_fields || {}).filter(([,v]) => v !== null && v !== undefined && v !== '');

  // Freshcaller'ın attığı saf sistem metadata notu ("created_by: ...\nfreshcaller: true\ntime: ...")
  // insana hiçbir bilgi vermiyor — gösterilecek konuşma listesinden çıkarıyoruz
  // (içindeki agent_id zaten "Created by" satırı için ayrıca kullanıldı).
  const visibleConversations = data.conversations.filter((c) => {
    const raw = c.body_text || c.body || '';
    return !(/created_by:\s*\d+/i.test(raw) && /freshcaller:\s*true/i.test(raw));
  });

  const convHtml = visibleConversations.map((c) => {
    const raw = c.body || c.body_text || '';
    const body = looksLikeHtml(raw) ? sanitizeHtml(raw) : renderChatText(raw, t.requester_name);
    const tagClass = c.private ? 'conv-tag-private' : (c.incoming ? 'conv-tag-customer' : 'conv-tag-agent');
    const tagLabel = c.private ? 'Dahili Not' : (c.incoming ? 'Müşteri' : 'Temsilci');
    return `
    <div class="conv-item ${c.private ? 'conv-private' : ''}" data-conv-id="${c._id}">
      <div class="conv-meta-row" onclick="toggleConvItem(this)">
        <span class="conv-tag ${tagClass}">${tagLabel}</span>
        <span class="conv-time">${fmtDate(c.created_at)}</span>
        <svg class="conv-chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div class="conv-body">${body}</div>
      <div class="conv-rec-slot" id="rec_c${c._id}"></div>
    </div>`;
  }).join('') || '<p class="empty-note">Konuşma kaydı yok.</p>';

  const attHtml = data.attachments.length
    ? `<div class="att-grid">${data.attachments.map(a => {
        const size = `${Math.round((a.size || 0) / 1024)} KB`;
        if (!a.attachment_url) return `<div class="att-item"><span style="color:#94a3b8;">${a.name}</span><span class="att-size">${size} — içerik mevcut değil</span></div>`;
        return `<div class="att-item"><a href="${a.attachment_url}" target="_blank" rel="noopener">${a.name}</a><span class="att-size">${size}</span></div>`;
      }).join('')}</div>`
    : '';

  const createdByRow = data.createdByName
    ? `<div class="created-by">${initialsAvatar(data.createdByName, 20)} Oluşturan: ${data.createdByName}</div>`
    : '';

  const mainCard = `
    <div class="card">
      <div class="card-head">
        <span class="card-head-icon">${INFO_ICON_SVG}Ana Bilgiler</span>
        <span class="card-head-sub">Son Güncelleme: ${fmtDate(t.updated_at)}</span>
      </div>
      <div class="field-list">
        <div class="field-item">
          <span class="field-label">Müşteri</span>
          <div class="field-with-avatar">
            ${initialsAvatar(t.requester_name || t.requester_email || '?', 20)}
            <span class="field-value">${t.requester_name || t.requester_email || '-'}</span>
          </div>
        </div>
        <div class="field-item">
          <span class="field-label">Şirket</span>
          <span class="field-value">${t.company_name || '— (Belirtilmemiş)'}</span>
        </div>
        <div class="field-item">
          <span class="field-label">Ajan</span>
          <div class="field-with-avatar">
            ${t.agent_name ? initialsAvatar(t.agent_name, 20) : ''}
            <span class="field-value">${t.agent_name || '-'}</span>
          </div>
        </div>
        <div class="field-item">
          <span class="field-label">Grup</span>
          ${t.group_name ? `<span class="field-chip">${t.group_name}</span>` : '<span class="field-value">-</span>'}
        </div>
        <div class="field-item">
          <span class="field-label">Tür</span>
          <span class="field-value">${t.ticket_type || '-'}</span>
        </div>
        <div class="field-item">
          <span class="field-label">Oluşturulma</span>
          <span class="field-value mono">${fmtDate(t.created_at)}</span>
        </div>
        ${(t.tags || []).length ? `<div class="tags-row">${t.tags.map(tag => `<span class="tag-chip">${tag}</span>`).join('')}</div>` : ''}
      </div>
    </div>
  `;

  const cfCard = `
    <div class="card">
      <div class="card-head">
        <span class="card-head-icon">${TAG_ICON_SVG}Özel Alanlar</span>
        ${customFields.length ? `<span class="count-chip">${customFields.length} Parametre</span>` : ''}
      </div>
      ${customFields.length ? `
        <div class="cf-grid">
          ${customFields.map(([k, v]) => `
            <div class="cf-item">
              <span class="cf-key" title="${k}">${k}</span>
              <span class="cf-val" title="${v}">${typeof v === 'boolean' ? (v ? 'Evet' : 'Hayır') : v}</span>
            </div>
          `).join('')}
        </div>
      ` : '<div class="cf-empty">Özel alan yok.</div>'}
    </div>
  `;

  const skipFirstMessage = t.source === 3;

  document.getElementById('panel').innerHTML = `
    <span class="close" onclick="closeTicket()">✕</span>
    <div class="th-header">
      <div class="th-header-main">
        <div class="th-icon">${TICKET_ICON_SVG}</div>
        <div>
          <h1>#${t._id} — ${t.subject || '(konu yok)'}</h1>
          <div class="th-badges">
            ${statusBadge(t.status, t.status_label)}
            ${t.priority_label ? `<span class="badge-plain">${t.priority_label}</span>` : ''}
            ${t.source_label ? channelBadgeHtml(t.source, t.source_label) : ''}
            <span class="badge badge-id">ID: #${t._id}</span>
          </div>
          ${createdByRow}
        </div>
      </div>
      <div class="th-actions">
        <button class="transcript-btn" id="transcriptBtn" type="button">${DOWNLOAD_ICON_SVG}Transkript</button>
      </div>
    </div>

    <div class="meta-grid-popup">
      ${mainCard}
      ${cfCard}
    </div>

    <div id="rec_ticket_level"></div>

    ${skipFirstMessage ? '' : `
      <div class="section-title"><span class="dot"></span>İlk Mesaj</div>
      <div class="conv-body-full">${looksLikeHtml(t.description) ? sanitizeHtml(t.description || '') : renderChatText(t.description || '', t.requester_name)}</div>
    `}

    <div class="section-title-row">
      <div class="section-title"><span class="dot"></span>Konuşmalar &amp; Notlar <span class="count">(${visibleConversations.length})</span></div>
      ${visibleConversations.length ? `<button class="expand-all-btn" id="expandAllBtn" onclick="toggleAllConvItems()" type="button">Tümünü Göster</button>` : ''}
    </div>
    ${convHtml}

    ${attHtml ? `<div class="section-title"><span class="dot"></span>Ekler <span class="count">(${data.attachments.length})</span></div>${attHtml}` : ''}
  `;
  document.getElementById('overlay').classList.add('visible');

  const transcriptBtn = document.getElementById('transcriptBtn');
  if (transcriptBtn) {
    transcriptBtn.addEventListener('click', () => downloadTranscript(t, visibleConversations, customFields, data.createdByName));
  }

  if (t.source === 3) loadRecordings(t._id);
}

function downloadTranscript(t, visibleConvs, customFields, createdByName) {
  const lines = [];
  lines.push(`#${t._id} — ${t.subject || '(konu yok)'}`);
  lines.push(`Durum: ${t.status_label || '-'}  |  Öncelik: ${t.priority_label || '-'}  |  Kaynak: ${t.source_label || '-'}`);
  lines.push(`Müşteri: ${t.requester_name || '-'} (${t.requester_email || '-'})`);
  lines.push(`Şirket: ${t.company_name || '-'}  |  Ajan: ${t.agent_name || '-'}  |  Grup: ${t.group_name || '-'}`);
  lines.push(`Oluşturulma: ${fmtDate(t.created_at)}  |  Güncellenme: ${fmtDate(t.updated_at)}`);
  if (createdByName) lines.push(`Oluşturan: ${createdByName}`);
  if ((t.tags || []).length) lines.push(`Etiketler: ${t.tags.join(', ')}`);

  if (customFields.length) {
    lines.push('', 'Özel Alanlar:');
    customFields.forEach(([k, v]) => lines.push(`  ${k}: ${typeof v === 'boolean' ? (v ? 'Evet' : 'Hayır') : v}`));
  }

  lines.push('', '--- Konuşmalar & Notlar ---');
  if (t.source !== 3 && t.description) {
    lines.push('', `[İlk Mesaj]`, stripToText(t.description));
  }
  visibleConvs.forEach((c) => {
    const who = c.private ? 'Dahili Not' : (c.incoming ? 'Müşteri' : 'Temsilci');
    lines.push('', `[${who} · ${fmtDate(c.created_at)}]`, stripToText(c.body || c.body_text || ''));
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ticket-${t._id}-transkript.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderRecPlayer(url, ambiguous, blobName) {
  const label = ambiguous
    ? '<div class="rec-ambiguous">⚠ Bu gün için birden fazla arama var, hangisi olduğu kesin değil:</div>'
    : '';
  return `
    <div class="rec-player">
      <div class="rec-player-top">
        <span class="rec-player-label"><span class="live-dot"></span>Görüşme Kaydı<span class="blob-name">${(blobName || '').split('/').pop()}</span></span>
      </div>
      ${label}
      <audio class="rec-audio" controls preload="none" src="${url}"></audio>
    </div>`;
}

async function loadRecordings(id) {
  try {
    const res = await fetch('/api/ticket-recording?id=' + id);
    const data = await res.json();
    if (!res.ok || data.error || !data.recordings) return; // sessizce geç, ses kaydı olmayabilir

    data.recordings.forEach((rec) => {
      const targetId = rec.conversation_id ? `rec_c${rec.conversation_id}` : 'rec_ticket_level';
      const el = document.getElementById(targetId);
      if (el) {
        el.insertAdjacentHTML('beforeend', renderRecPlayer(rec.url, rec.ambiguous, rec.blob));
        const convItem = el.closest('.conv-item');
        if (convItem) convItem.classList.add('conv-has-rec');
      }
    });
  } catch (e) {
    // sessiz geç — ses kaydı arayüzü opsiyonel bir katkı, ticket görüntülemeyi bloklamamalı
  }
}

function closeTicket() {
  document.getElementById('overlay').classList.remove('visible');
}

function toggleConvItem(headerEl) {
  const item = headerEl.closest('.conv-item');
  item.classList.toggle('open');
  syncExpandAllLabel();
}

function toggleAllConvItems() {
  const items = document.querySelectorAll('#panel .conv-item');
  const allOpen = items.length > 0 && [...items].every((i) => i.classList.contains('open'));
  items.forEach((i) => i.classList.toggle('open', !allOpen));
  syncExpandAllLabel();
}

function syncExpandAllLabel() {
  const btn = document.getElementById('expandAllBtn');
  if (!btn) return;
  const items = document.querySelectorAll('#panel .conv-item');
  const allOpen = items.length > 0 && [...items].every((i) => i.classList.contains('open'));
  btn.textContent = allOpen ? 'Tümünü Daralt' : 'Tümünü Göster';
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeTicket();
});

document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { page = 1; load(); }
});
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(window._qDebounce);
  window._qDebounce = setTimeout(() => { page = 1; load(); }, 300);
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
});
document.getElementById('first').addEventListener('click', () => { page = 1; load(); });
document.getElementById('prev').addEventListener('click', () => { page--; load(); });
document.getElementById('next').addEventListener('click', () => { page++; load(); });
document.getElementById('last').addEventListener('click', () => { page = window._lastTotalPages || page; load(); });

const perPageSelect = document.getElementById('perPageSelect');
perPageSelect.value = String(perPage);
perPageSelect.addEventListener('change', () => {
  perPage = Number(perPageSelect.value);
  localStorage.setItem(PERPAGE_KEY, String(perPage));
  page = 1;
  load();
});

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();
    if (!res.ok || data.error) return; // istatistik kartları opsiyonel bir katkı, sayfayı bloklamamalı

    const setStat = (key, value) => {
      const el = document.querySelector(`[data-stat="${key}"]`);
      if (el) { el.textContent = value; el.classList.remove('stat-skel'); }
    };
    setStat('total', data.total.toLocaleString('tr-TR'));
    setStat('closed', data.closed.toLocaleString('tr-TR'));
    setStat('contacts', data.contacts.toLocaleString('tr-TR'));

    document.querySelector('[data-stat="closed"]').insertAdjacentHTML('beforeend', `<span class="stat-sub" style="color:#059669;">%${data.closedPct}</span>`);
  } catch (e) {
    // sessiz geç
  }
}

renderColumnsPanel();
renderTableStructure();

const urlParams = new URLSearchParams(location.search);
const qParam = urlParams.get('q');
if (qParam) document.getElementById('q').value = qParam;

load();
loadStats();
</script>
